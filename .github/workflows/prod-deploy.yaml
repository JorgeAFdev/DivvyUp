name: Production Pipeline

on:
  push:
    branches:
      - main
    # Only rebuild when something that actually lands in the image changes.
    # The root manifests and lockfile are included because the Docker build
    # installs backend deps from the workspace lockfile.
    paths:
      - 'backend/**'
      - 'packages/shared/**'
      - 'packages/validation/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.dockerignore'
      - '.github/workflows/prod-deploy.yaml'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v5

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      # Build context is the repo root so pnpm can read pnpm-lock.yaml and
      # pnpm-workspace.yaml; the Dockerfile itself still lives in backend/.
      - name: 'Build Backend Image'
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/divvyup:latest"
          docker build . --file backend/Dockerfile --tag "$image"
          docker push "$image"

      - name: 'Trigger Coolify redeploy and wait'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          resp=$(curl --fail --silent --show-error -X POST \
            "https://coolify.jorgeaf.dev/api/v1/deploy" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"uuid":"uset5w5tsg77ctdfczsp0hse","force":false}')
          dep=$(echo "$resp" | jq -r '.deployments[0].deployment_uuid')
          [ -n "$dep" ] && [ "$dep" != "null" ] || { echo "no deployment_uuid: $resp"; exit 1; }
          echo "polling deployment $dep ..."
          for i in $(seq 1 60); do
            status=$(curl --fail --silent --show-error \
              "https://coolify.jorgeaf.dev/api/v1/deployments/$dep" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" | jq -r '.status')
            echo "attempt $i: $status"
            case "$status" in
              finished)          echo "deploy OK"; exit 0 ;;
              failed|cancelled*) echo "deploy failed: $status"; exit 1 ;;
            esac
            sleep 5
          done
          echo "timed out waiting for deployment"; exit 1
