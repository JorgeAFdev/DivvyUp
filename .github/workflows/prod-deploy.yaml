name: Production Pipeline

on:
  push:
    branches:
      - main
    # Only rebuild when something that actually lands in the image changes.
    # The root manifests and lockfile are included because the Docker build
    # installs backend deps from the workspace lockfile.
    paths:
      - 'backend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.dockerignore'
      - '.github/workflows/prod-deploy.yaml'

jobs:
  build-deploy-to-koyeb:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      # Build context is the repo root so pnpm can read pnpm-lock.yaml and
      # pnpm-workspace.yaml; the Dockerfile itself still lives in backend/.
      - name: 'Build Backend Image'
        run: |
          docker build . --file backend/Dockerfile --tag ghcr.io/divvyup-app/splitwise:latest
          docker push ghcr.io/divvyup-app/splitwise:latest

      - name: 'Trigger Coolify redeploy'
        run: |
          curl --fail --silent --show-error \
            "https://coolify.jorgeaf.dev/api/v1/deploy?uuid=uset5w5tsg77ctdfczsp0hse&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Install and configure the Koyeb CLI
        uses: koyeb-community/install-koyeb-cli@v2
        with:
          api_token: '${{ secrets.KOYEB_TOKEN }}'
          github_token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Deploy to Koyeb
        run: koyeb service redeploy wandering-nert/splitwise --wait
