name: Typecheck

on:
  pull_request:
    # The TypeScript workspaces are packages/shared, the backend and the frontend
    # (mid-migration, allowJs). The root manifests and the shared base config are
    # watched because each one changes what tsc sees.
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packages/shared/**'
      - 'packages/validation/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/typecheck.yaml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    name: 'Typecheck ${{ matrix.workspace }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: shared
            install: '--filter=@monorepo/shared...'
            build: '--filter=@monorepo/shared'
          - workspace: validation
            install: '--filter=@monorepo/validation...'
            build: '--filter=@monorepo/validation'
          - workspace: backend
            # shared and validation are selected too so their build toolchain
            # (tsc) installs; the backend imports both, so both must be buildable
            # here (validation ships runtime code, shared is type-only).
            install: '--filter=@monorepo/backend... --filter=@monorepo/shared --filter=@monorepo/validation'
            build: '--filter=@monorepo/shared --filter=@monorepo/validation'
          - workspace: frontend
            # Same reason as backend: the frontend imports the contract's types
            # and the validation schemas, so both have to be buildable here.
            install: '--filter=@monorepo/frontend... --filter=@monorepo/shared --filter=@monorepo/validation'
            build: '--filter=@monorepo/shared --filter=@monorepo/validation'

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5

      - name: 'Setup pnpm'
        uses: pnpm/action-setup@v6

      - name: 'Setup Node'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # No --prod: tsc lives in devDependencies. Skip mongodb-memory-server's
      # mongod download; only tsc runs here.
      - name: 'Install'
        run: pnpm install --frozen-lockfile ${{ matrix.install }}
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'

      # Consumers resolve @monorepo/shared and @monorepo/validation from their
      # dist/, so build the ones this job needs first.
      - name: 'Build workspace deps'
        run: pnpm ${{ matrix.build }} build

      - name: 'Typecheck ${{ matrix.workspace }}'
        run: pnpm --filter=@monorepo/${{ matrix.workspace }} typecheck
