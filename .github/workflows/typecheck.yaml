name: Typecheck

on:
  pull_request:
    # The TypeScript workspaces are packages/shared, the backend and the frontend
    # (mid-migration, allowJs). The root manifests and the shared base config are
    # watched because each one changes what tsc sees.
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packages/shared/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/typecheck.yaml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    name: 'Typecheck ${{ matrix.workspace }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: shared
            install: '--filter=@monorepo/shared...'
          - workspace: backend
            # shared is selected too so its build toolchain (tsc) installs; the
            # backend imports its types, so shared must be buildable here.
            install: '--filter=@monorepo/backend... --filter=@monorepo/shared'
          - workspace: frontend
            # Same reason as backend: the frontend imports the contract's types,
            # so shared has to be buildable in this job.
            install: '--filter=@monorepo/frontend... --filter=@monorepo/shared'

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup pnpm'
        uses: pnpm/action-setup@v4

      - name: 'Setup Node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # No --prod: tsc lives in devDependencies. Skip mongodb-memory-server's
      # mongod download; only tsc runs here.
      - name: 'Install'
        run: pnpm install --frozen-lockfile ${{ matrix.install }}
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'

      # The backend resolves @monorepo/shared from its dist/, so build it first.
      - name: 'Build shared'
        run: pnpm --filter=@monorepo/shared build

      - name: 'Typecheck ${{ matrix.workspace }}'
        run: pnpm --filter=@monorepo/${{ matrix.workspace }} typecheck
